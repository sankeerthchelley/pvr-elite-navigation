<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PVR Elite — Navigation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{background:#eaecf2;font-family:"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;}

#topbar{width:100%;background:#1a1f2e;padding:10px 20px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,.6);border-bottom:1px solid #2a3248;}
.logo{color:#e2502e;font-weight:900;font-size:20px;letter-spacing:2px;}
.logo span{color:#f3eee2;}
.tagline{color:#5a6a86;font-size:12px;letter-spacing:1px;}
.hint-chip{margin-left:auto;background:#1e2a42;border:1px solid #2e3f66;color:#7ec8e3;padding:6px 14px;border-radius:20px;font-size:12px;}
#block-btns{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;}
.blk-btn{padding:8px 18px;background:#1e2a40;border:1.5px solid #2a3a56;border-radius:8px;color:#e2502e;font-size:14px;font-weight:900;cursor:pointer;transition:all .15s;white-space:nowrap;}
.blk-btn:hover{background:#2a3050;border-color:#e2502e;}
.blk-btn.sel{background:#e2502e;color:#fff;border-color:#e2502e;}
.sel-row{width:100%;background:#131926;padding:9px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #1e2a3e;}
.sel-row.hidden{display:none;}
.sel-row-lbl{font-size:10px;color:#3a4a6a;text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;margin-right:4px;}
.floor-code-btn{padding:10px 22px;background:#1e2a40;border:1.5px solid #2a3a56;border-radius:10px;color:#7ec8e3;font-size:18px;font-weight:900;cursor:pointer;transition:all .15s;}
.floor-code-btn:hover{background:#1a3a60;border-color:#7ec8e3;}
.floor-code-btn.sel{background:#7ec8e3;color:#0f111a;border-color:#7ec8e3;}
.flat-code-btn{padding:7px 12px;background:#1e2a40;border:1.5px solid #2a3a56;border-radius:8px;color:#c8d0e0;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;}
.flat-code-btn:hover{background:#2a3050;border-color:#e2502e;color:#fff;}
.flat-code-btn.sel{background:#e2502e;color:#fff;border-color:#e2502e;}

#layout{display:flex;flex:1;min-height:0;overflow:hidden;position:relative;}

#map-wrap{flex:1;min-width:0;overflow:hidden;position:relative;}
svg{display:block;width:100%;height:100%;}

/* BLOCK ZONES */
.block-zone{cursor:pointer;fill:transparent;stroke:transparent;stroke-width:0;transition:fill .2s,stroke .2s;}
.block-zone:hover{fill:rgba(226,80,46,.08);stroke:#e2502e;stroke-width:3;stroke-dasharray:8 5;}
.block-zone.active{fill:rgba(226,80,46,.14);stroke:#e2502e;stroke-width:3;}

/* FLAT ZONES */
.flat-zone{cursor:pointer;fill:transparent;transition:fill .15s;}
.flat-zone:hover{fill:rgba(126,200,227,.2);}
.flat-zone.picked{fill:rgba(226,80,46,.35);stroke:#e2502e;stroke-width:4;}

/* AMENITY ZONES */
.amenity-zone{cursor:pointer;fill:transparent;transition:fill .15s;}
.amenity-zone:hover{fill:rgba(126,200,227,.25);}
.amenity-zone.picked{fill:rgba(126,200,227,.4);}

/* LIFT MARKERS */
.lift-marker{pointer-events:none;}

/* ROUTE */
#route-path{fill:none;stroke:#e2502e;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22 12;animation:dash 1s linear infinite;filter:drop-shadow(0 0 8px rgba(226,80,46,.8));opacity:0;transition:opacity .4s;pointer-events:none;}
#route-path.on{opacity:1;}
@keyframes dash{to{stroke-dashoffset:-68;}}
.pin-s{fill:#e2502e;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6));}
.pin-d{fill:#7ec8e3;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6));}

/* NAV PANEL — overridden below by sidebar styles */

/* FLAT PICKER */
.picker-label{font-size:11px;color:#5a6a86;text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;}
.flat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:18px;}
.flat-btn{padding:9px 4px;background:#1e2a40;border:1.5px solid #2a3a56;border-radius:8px;color:#c8d0e0;font-size:13px;font-weight:700;cursor:pointer;text-align:center;transition:all .15s;}
.flat-btn:hover{background:#2a3f66;border-color:#e2502e;color:#fff;}
.flat-btn.sel{background:#e2502e;border-color:#e2502e;color:#fff;}

/* FLOOR PICKER */
.floor-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px;}
.floor-btn{padding:14px 4px;background:#1e2a40;border:1.5px solid #2a3a56;border-radius:10px;color:#7ec8e3;font-size:18px;font-weight:900;cursor:pointer;text-align:center;transition:all .15s;}
.floor-btn:hover{background:#1a3a60;border-color:#7ec8e3;color:#fff;}
.floor-btn.sel{background:#7ec8e3;color:#0f111a;border-color:#7ec8e3;}
.floor-note{font-size:11px;color:#5a6a86;margin-bottom:14px;line-height:1.5;}

/* NAV STEPS */
.nav-section-title{font-size:11px;color:#5a6a86;text-transform:uppercase;letter-spacing:.8px;margin:14px 0 8px;}
.step{display:flex;gap:10px;align-items:flex-start;margin-bottom:9px;padding:10px 12px;background:#1a2235;border-radius:9px;border-left:3px solid #2a3a56;}
.step.highlight{border-left-color:#e2502e;}
.step.lift-step{border-left-color:#f0c030;background:#1e2418;}
.step.dest-step{border-left-color:#7ec8e3;background:#121e2e;}
.step-num{width:26px;height:26px;border-radius:50%;background:#2a3a56;color:#7ec8e3;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.step.lift-step .step-num{background:#3a3200;color:#f0c030;}
.step.dest-step .step-num{background:#0e2035;color:#7ec8e3;}
.step-text{color:#b0bcd0;font-size:13px;line-height:1.55;}
.step-text strong{color:#f3eee2;}
.step-text .lift-tag{display:inline-block;background:#3a3200;color:#f0c030;border:1px solid #6a5800;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;margin-top:4px;}
.step-text .btn-tag{display:inline-block;background:#1a3800;color:#7ef07e;border:1px solid #2a6800;border-radius:6px;padding:3px 10px;font-size:14px;font-weight:900;margin-top:4px;letter-spacing:1px;}
.flat-summary{background:#1e2a40;border:1.5px solid #2a3a56;border-radius:10px;padding:14px;margin-bottom:14px;}
.flat-summary .fs-id{font-size:22px;font-weight:900;color:#e2502e;}
.flat-summary .fs-detail{font-size:13px;color:#7ec8e3;margin-top:2px;}
.back-btn{width:100%;padding:10px;background:#1a2235;border:1.5px solid #2a3a56;color:#8a9ab5;border-radius:8px;font-size:13px;cursor:pointer;margin-top:10px;}
.back-btn:hover{border-color:#e2502e;color:#e2502e;}

/* AMENITY PANEL */
.amenity-icon-big{font-size:48px;text-align:center;margin-bottom:8px;}
.amenity-desc{color:#8a9ab5;font-size:13px;line-height:1.6;margin-bottom:14px;}

/* LEGEND BAR */
#legend-bar{width:100%;background:#1a1f2e;padding:8px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #222d45;}
.leg-icon{width:42px;height:42px;border-radius:10px;background:#1e2a40;border:1.5px solid #2a3a56;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:all .15s;position:relative;}
.leg-icon:hover{background:#2a3f66;border-color:#7ec8e3;transform:translateY(-2px);}
.leg-icon.active{background:#1e3060;border-color:#7ec8e3;}
.leg-icon[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#0f111a;color:#f3eee2;font-size:11px;padding:4px 8px;border-radius:6px;white-space:nowrap;border:1px solid #2a3a56;pointer-events:none;z-index:200;}
.leg-sep{width:1px;height:28px;background:#2a3a56;margin:0 4px;}
.leg-label{font-size:11px;color:#3a4a5e;margin-left:auto;}

/* TOAST */
/* Sidebar footer — share buttons */
#sidebar-footer{flex-shrink:0;display:flex;gap:8px;padding:12px 14px;border-top:1px solid #e8eaed;background:#f8f9fc;}
.share-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:9px 10px;border-radius:10px;border:1.5px solid #dde2ec;background:#f4f6fb;color:#6a7a90;font-size:13px;font-weight:700;cursor:pointer;transition:all .18s;}
.share-btn svg{width:17px;height:17px;flex-shrink:0;}
.share-btn:not(:disabled):hover{background:#fff;border-color:#e2502e;color:#e2502e;}
.share-btn.share-wa:not(:disabled){border-color:#c8e6c0;background:#f0fff0;color:#25a244;}
.share-btn.share-wa:not(:disabled):hover{background:#e0f8e0;border-color:#25a244;}
.share-btn:disabled{opacity:.35;cursor:not-allowed;}

#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(40px);background:#1e2535;color:#f3eee2;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 4px 24px rgba(0,0,0,.5);z-index:300;transition:transform .25s;pointer-events:none;border:1px solid #3a4560;opacity:0;}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

@media(max-width:700px){
  #topbar{padding:8px 14px;}
  .logo{font-size:16px;}
  #layout{flex-direction:column;}
  #sidebar{width:100%;height:auto;border-left:none;border-top:2px solid #e0e4ec;max-height:52vh;flex-direction:row;overflow:hidden;}
  #sidebar-controls{display:flex;flex-direction:row;overflow-x:auto;flex-shrink:0;}
  .sb-section{padding:8px 12px;border-bottom:none;border-right:1px solid #f0f2f8;min-width:max-content;}
  #nav-panel{flex:1;overflow:hidden;min-width:0;}
  .leg-icon{width:32px;height:32px;font-size:15px;}
  .blk-btn{padding:5px 9px;font-size:12px;}
  .flat-search-input{font-size:18px;width:88px;}
  .search-hint{display:none;}
}

/* ══ WHITE THEME ══════════════════════════════════════════════════ */
body{background:#eaecf2;}
.hidden{display:none!important;}

/* Topbar — minimal, title only */
#topbar{background:#fff;border-bottom:1px solid #e0e4ec;box-shadow:0 1px 8px rgba(0,0,0,.07);
  display:flex;align-items:center;padding:10px 22px;gap:10px;flex-shrink:0;}
.logo{color:#1a2035;font-size:18px;font-weight:900;letter-spacing:2px;}
.logo span{color:#e2502e;}
.tagline{color:#9aacca;font-size:10px;letter-spacing:1.5px;}

/* Sidebar toggle button */
#sidebar-toggle{margin-left:auto;width:36px;height:36px;border-radius:8px;background:#f4f6fb;border:1.5px solid #dde2ec;color:#555;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
#sidebar-toggle:hover{background:#fff0ec;border-color:#e2502e;color:#e2502e;}

/* Right sidebar */
#sidebar{width:300px;flex-shrink:0;background:#fff;border-left:2px solid #e0e4ec;display:flex;flex-direction:column;overflow:hidden;}
#sidebar-controls{flex-shrink:0;}
.sb-section{padding:12px 16px;border-bottom:1px solid #f0f2f8;}
.sb-label{font-size:10px;font-weight:700;color:#aab8d0;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:8px;}
.amenity-icons-row{display:flex;flex-wrap:wrap;gap:5px;}
.block-btns-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}

/* Legend icons in sidebar */
.leg-icon{background:#f4f6fb;border:1.5px solid #dde2ec;color:#555;}
.leg-icon:hover{background:#fff0ec;border-color:#e2502e;transform:translateY(-2px);}
.leg-icon.active{background:#fff0ec;border-color:#e2502e;}
.leg-icon[data-tip]:hover::after{background:#1a2035;border-color:#3a4560;}

/* Block label + buttons in sidebar */
.blk-label{font-size:11px;font-weight:700;color:#9aacca;letter-spacing:1px;white-space:nowrap;}
.blk-btn{padding:7px 14px;font-size:13px;background:#f4f6fb;border-color:#dde2ec;color:#e2502e;}
.blk-btn:hover{background:#fff0ec;border-color:#e2502e;}
.blk-btn.sel{background:#e2502e;color:#fff;border-color:#e2502e;}

/* Search in sidebar */
.flat-search-wrap{display:flex;align-items:flex-start;flex-direction:column;gap:6px;}
.flat-search-input{padding:9px 16px;background:#fff;border:2px solid #c8d4e8;border-radius:10px;color:#1a2035;font-size:22px;font-weight:900;width:110px;text-align:center;letter-spacing:6px;outline:none;transition:border-color .15s;}
.flat-search-input:focus{border-color:#7ec8e3;}
.flat-search-input.valid{border-color:#4ca86c;background:#f0fff5;}
.flat-search-input.invalid{border-color:#e2502e;background:#fff5f3;}
.search-error{font-size:12px;font-weight:600;color:#e2502e;min-height:16px;}
.search-error.ok{color:#4ca86c;}
.search-hint{font-size:11px;color:#aab8d0;line-height:1.5;}

/* Nav directions panel inside sidebar */
#nav-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;}
#panel-head{background:#f8f9fc;border-bottom:1px solid #e8eaed;padding:12px 16px;flex-shrink:0;display:flex;align-items:center;gap:8px;}
#panel-head-title{color:#e2502e;font-size:14px;font-weight:800;flex:1;}
#panel-close{background:none;border:none;color:#aab8d0;font-size:18px;cursor:pointer;padding:2px 6px;}
#panel-close:hover{color:#e2502e;}
#panel-body{flex:1;overflow-y:auto;padding:14px 16px;}
.picker-label{color:#aab8d0;}
.flat-btn{background:#f4f6fb;border-color:#dde2ec;color:#4a5568;}
.flat-btn:hover{background:#fff0ec;border-color:#e2502e;color:#e2502e;}
.flat-btn.sel{background:#e2502e;border-color:#e2502e;color:#fff;}
.floor-btn{background:#f4f6fb;border-color:#dde2ec;color:#2a6080;}
.floor-btn:hover{background:#e8f4fc;border-color:#5ab8d8;color:#1a2035;}
.floor-btn.sel{background:#5ab8d8;color:#fff;border-color:#4aa8c8;}
.floor-note{color:#aab8d0;}
.nav-section-title{color:#aab8d0;}
.flat-summary{background:#f4f6fb;border-color:#dde2ec;}
.flat-summary .fs-id{color:#e2502e;}
.flat-summary .fs-detail{color:#5a80a0;}
.step{background:#f8f9fc;border-left-color:#dde2ec;}
.step.highlight{border-left-color:#e2502e;}
.step.lift-step{border-left-color:#d09020;background:#fffbf2;}
.step.dest-step{border-left-color:#2090a8;background:#f0fafc;}
.step-num{background:#dde2ec;color:#6a7a90;}
.step.lift-step .step-num{background:#f8e8a0;color:#806000;}
.step.dest-step .step-num{background:#b8e4f0;color:#006080;}
.step-text{color:#4a5a6e;}
.step-text strong{color:#1a2035;}
.step-text .lift-tag{background:#fdf0c0;color:#806020;border-color:#d0c060;}
.step-text .btn-tag{background:#e0f0e0;color:#2a6a20;border-color:#80c070;}
.back-btn{background:#f4f6fb;border-color:#dde2ec;color:#6a7a90;}
.back-btn:hover{border-color:#e2502e;color:#e2502e;}
.amenity-desc{color:#5a7090;}
#toast{background:#1a2035;color:#f3eee2;border-color:#3a4560;}
</style>
</head>

// ─── BLOCK SELECT ────────────────────────────────────────────────────────────
function selectBlock(blk){
  clearAll();
  S.block = blk; S.flat = null; S.floor = null; S.flatCode = null;
  document.getElementById('bb-'+blk).classList.add('sel');
  document.getElementById('bz-'+blk).classList.add('active');
  // Show search row
  const sr = document.getElementById('search-row');
  const inp = document.getElementById('flat-search');
  const errEl = document.getElementById('search-error');
  const hint = document.getElementById('search-hint');
  const m = BLOCK_META[blk];
  inp.value = '';
  inp.classList.remove('valid','invalid');
  errEl.textContent = '';
  errEl.className = 'search-error';
  hint.innerHTML = `Floor 1–5 · Flats 01–${String(m.flats).padStart(2,'0')} · e.g. <strong>2${String(Math.ceil(m.flats/2)).padStart(2,'0')}</strong>`;
  sr.classList.remove('hidden');
  inp.focus();
  // Draw route to block
  const r = document.getElementById('route-path');
  r.setAttribute('d', m.route);
  r.classList.add('on');
  document.getElementById('start-pin').style.opacity='1';
  moveDestPin(m.dest[0], m.dest[1]);
}

function selectFlatZone(blk, num){
  selectBlock(blk);
  document.getElementById('bz-'+blk).classList.remove('active'); // focus the flat, not the whole block
  const fz = document.getElementById('fz-'+blk+num);
  if(fz) fz.classList.add('picked');
  const pxy = pinXY(blk, num);
  if(pxy) moveDestPin(pxy[0], pxy[1]);
  const r = document.getElementById('route-path');
  r.setAttribute('d', buildFlatRoute(blk, num));
  showToast(`Flat ${blk}-${num} selected — enter the floor (1–5) to see full directions`);
}

// ─── SEARCH / VALIDATE FLAT CODE ─────────────────────────────────────────────
function handleSearch(val){
  const inp = document.getElementById('flat-search');
  const errEl = document.getElementById('search-error');
  // Only digits
  const clean = val.replace(/\D/g,'');
  if(clean !== val){ inp.value = clean; val = clean; }
  inp.classList.remove('valid','invalid');
  errEl.textContent = '';
  errEl.className = 'search-error';
  if(val.length < 3) return;
  const code = parseInt(val, 10);
  const fl = Math.floor(code / 100);
  const flatNum = code % 100;
  const maxFlats = BLOCK_META[S.block].flats;
  if(fl < 1 || fl > 5){
    errEl.textContent = `Floor ${fl} doesn't exist — only floors 1–5`;
    inp.classList.add('invalid'); return;
  }
  if(flatNum < 1 || flatNum > maxFlats){
    errEl.textContent = `Flat ${String(flatNum).padStart(2,'0')} doesn't exist in Block ${S.block} — max is ${String(maxFlats).padStart(2,'0')}`;
    inp.classList.add('invalid'); return;
  }
  // Valid — navigate
  inp.classList.add('valid');
  errEl.textContent = '✓ Found';
  errEl.className = 'search-error ok';
  S.flatCode = code;
  S.floor = fl;
  S.flat = String(flatNum).padStart(2,'0');
  showNav(S.block, S.flat, S.floor, code);
}

// ─── NAVIGATION PANEL ────────────────────────────────────────────────────────
function showNav(blk, num, fl, code){
  const key = blk + num;
  const fi = FLAT_INFO[key];
  if(!fi){ showToast('Flat data not found'); return; }
  const m = BLOCK_META[blk];
  const roads = BLOCK_ROAD[blk];
  const flatId = `${blk}-${code}`;   // e.g. A-307

  let roadSteps = roads.map((s,i)=>`
    <div class="step ${i===roads.length-1?'highlight':''}">
      <div class="step-num">${i+1}</div>
      <div class="step-text">${s}</div>
    </div>`).join('');

  const entryText = fi.wingEntry || fi.entry || '';
  let n = roads.length;

  // Point the destination pin at this exact flat (same spot regardless of floor),
  // focus just the flat (not the whole block), and route the dashes through it.

  document.querySelectorAll('.flat-zone').forEach(z=>z.classList.remove('picked'));
  document.getElementById('fz-'+key)?.classList.add('picked');
  const pxy = pinXY(blk, num);
  if(pxy) moveDestPin(pxy[0], pxy[1]);
  document.getElementById('route-path').setAttribute('d', buildFlatRoute(blk, num));

  setPanel(`📍 Flat ${flatId}`,`

  document.querySelectorAll('.block-zone').forEach(z=>z.classList.remove('active'));
  document.querySelectorAll('.amenity-zone').forEach(z=>z.classList.remove('picked'));
  document.querySelectorAll('.flat-zone').forEach(z=>z.classList.remove('picked'));

  document.querySelectorAll('.blk-btn').forEach(b=>b.classList.remove('sel'));

  document.getElementById('dest-pin').style.opacity='0';
  document.getElementById('search-row').classList.add('hidden');
  document.getElementById('nav-panel').classList.add('hidden');

  S = {block:null, flat:null, floor:null, flatCode:null};

function shareFlatLink(){
  if(!S.flatCode || !S.block) return;
  const flatId = `${S.block}-${S.flatCode}`;
  const url = window.location.href.split('?')[0] + `?flat=${flatId}`;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(()=>showToast('Link copied to clipboard!'));
  } else {
    showToast('Copy this: ' + url);
  }
}

  if(!S.flatCode || !S.block) return;
  const flatId = `${S.block}-${S.flatCode}`;
  const msg = `🏠 *PVR Elite — Navigation Guide*\n\n*Flat:* ${flatId} (Floor ${S.floor}, Flat ${S.flat})\n📍 *Location:* Kanuru, Vijayawada\n\nOpen the navigation guide and select *Block ${S.block}* → enter code *${S.flatCode}* for step-by-step directions inside the compound.`;
  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
}

function moveDestPin(cx,cy){
  document.getElementById('dest-pin').setAttribute('transform', `translate(${cx},${cy})`);
  document.getElementById('dest-pin').style.opacity='1';
}

// Nudges the pin toward the corridor-facing edge of a flat's zone instead of
// dead-center (so it doesn't sit on top of the flat's size/number labels).
function pinXY(blk, num){
  const xy = FLAT_XY[blk] && FLAT_XY[blk][num];
  if(!xy) return null;
  let [x,y] = xy;
  if(blk==='B') y += (y<950 ? 20 : -20);
  else if(blk==='C') y += (y<540 ? 55 : -55);
  return [x,y];
}

// Builds a route path that only travels the outdoor road, then the corridor,
// then a straight drop/rise into the target flat's column — never diagonally
// across other flats. Precise for B/C (which have a mapped corridor); A/D fall
// back to a straight extension since their corridors aren't mapped yet.
function buildFlatRoute(blk, num){
  const base = BLOCK_META[blk].route;
  const xy = FLAT_XY[blk] && FLAT_XY[blk][num];
  if(!xy) return base;
  const [fx, fy] = xy;
  if(blk==='B') return `${base} L1144,955 L${fx},955 L${fx},${fy}`;
  if(blk==='C'){
    if(fy < 540) return `${base} L1655,540 L${fx},540 L${fx},${fy}`;
    return `${base} L${fx},580 L${fx},${fy}`;
  }
  return `${base} L${fx},${fy}`;
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('hidden');
}

let _tt;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove('show'),3000);
}

showToast('Tap any Block label or legend icon to start navigating');
</script>
